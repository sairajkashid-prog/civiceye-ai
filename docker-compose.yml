version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: civiceye
      POSTGRES_USER: civiceye
      # Override in a local .env file (see .env.example); defaults keep the demo zero-config
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civiceye123}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  backend:
    build: ./backend
    ports: ["5000:5000"]
    environment:
      DATABASE_URL: postgres://civiceye:${POSTGRES_PASSWORD:-civiceye123}@postgres:5432/civiceye
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
    depends_on: [postgres, redis]
    volumes: ["./backend/uploads:/app/uploads"]

  # ai-engine (Python YOLOv8 service in production)
  ai-engine:
    build: ./ai-engine
    ports: ["8001:8000"]
    environment:
      MODEL_PATH: /models/yolov8_civic.pt

  frontend:
    build: ./frontend
    ports: ["80:80"]
    depends_on: [backend]

volumes:
  pgdata:
